version: '3.8'

services:
  backend:
    build:
      context: ./branding-calculator-backend
      dockerfile: Dockerfile
    container_name: branding-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - ConnectionStrings__DefaultConnection=Data Source=/app/Data/yamal.db;Foreign Keys=True;Mode=ReadWrite
    volumes:
      - backend_data:/app/Data
      - backend_uploads:/app/uploads
    ports:
      - "5001:5001" 
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./branding-calculator-frontend
      dockerfile: Dockerfile
    container_name: branding-frontend
    ports:
      - "8080:80" 
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:

networks:
  app-network:
    driver: bridge
