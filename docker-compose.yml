services:
  db:
    image: postgres:16-alpine
    container_name: branding-db
    environment:
      - POSTGRES_USER=yamal_user
      - POSTGRES_PASSWORD=yamal_password  
      - POSTGRES_DB=yamal_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamal_user -d yamal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./branding-calculator-backend
      dockerfile: Dockerfile
    container_name: branding-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      # Строка подключения для PostgreSQL (Host=db соответствует имени сервиса выше)
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=yamal_db;Username=yamal_user;Password=yamal_password
    depends_on:
      db:
        condition: service_healthy 
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./branding-calculator-frontend
      dockerfile: Dockerfile
    container_name: branding-frontend
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: branding-nginx
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: 