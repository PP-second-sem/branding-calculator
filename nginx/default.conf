server {
    # Используем "_" как catch-all, чтобы Nginx отвечал на запросы по IP-адресу
    server_name 79.174.78.156; 
    listen 80;

    client_max_body_size 55M;

    # --- 1. API и Swagger отправляем в контейнер с бэкендом ---
    # ВАЖНО: branding-backend - это имя сервиса из docker-compose.yml, 8080 - его внутренний порт
    location /api/ {
        proxy_pass         http://branding-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /swagger {
        proxy_pass         http://branding-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- 2. Всё остальное (Angular) отправляем в контейнер с фронтендом ---
    # branding-frontend - имя сервиса, 80 - внутренний порт контейнера фронтенда
    location / {
        proxy_pass         http://branding-frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection keep-alive;
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
