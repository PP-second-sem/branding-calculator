# Перенаправление с HTTP на HTTPS
server {
    listen 80;
    server_name yamal.snaaas.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yamal.snaaas.ru;

    client_max_body_size 55M;

    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/yamal.snaaas.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yamal.snaaas.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 1. API и Swagger отправляем в контейнер backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Всё остальное отправляем в контейнер frontend (который сам является Nginx)
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
