<div class="data-tabs">
    <button
        type="button"
        *ngIf="layoutName !== 'Афиши'"
        class="data-tabs__tab"
        [class.data-tabs__tab--active]="activeTab === 'personal'"
        (click)="activeTab = 'personal'"
    >
        ФИО и должность
    </button>

    <button
        *ngIf="layoutName === 'Сертификаты' || layoutName === 'Дипломы'"
        type="button"
        class="data-tabs__tab"
        [class.data-tabs__tab--active]="activeTab === 'text'"
        (click)="activeTab = 'text'"
    >
        Текст
    </button>

    <button
        *ngIf="layoutName !== 'Афиши'"
        type="button"
        class="data-tabs__tab"
        [class.data-tabs__tab--active]="activeTab === 'contacts'"
        (click)="activeTab = 'contacts'"
    >
        {{ layoutName === 'Бейджи' || layoutName === 'Сертификаты' || layoutName === 'Дипломы' ? 'Место и дата' : 'Контактные данные' }}
    </button>

    <button
        *ngIf="layoutName === 'Визитки'"
        type="button"
        class="data-tabs__tab"
        [class.data-tabs__tab--active]="activeTab === 'qr'"
        (click)="activeTab = 'qr'"
    >
        QR-коды
    </button>
    
    <button
        *ngIf="layoutName === 'Афиши'"
        type="button"
        class="data-tabs__tab"
        [class.data-tabs__tab--active]="activeTab === 'event'"
        (click)="activeTab = 'event'">
        Мероприятие
    </button>

    <button
        *ngIf="layoutName === 'Афиши'"
        type="button"
        class="data-tabs__tab"
        [class.data-tabs__tab--active]="activeTab === 'desc'"
        (click)="activeTab = 'desc'">
        Описание
    </button>

    <button
        *ngIf="layoutName === 'Афиши'"
        type="button"
        class="data-tabs__tab"
        [class.data-tabs__tab--active]="activeTab === 'place_and_time'"
        (click)="activeTab = 'place_and_time'">
        Место и время
    </button>

    <button
        *ngIf="layoutName === 'Афиши'"
        type="button"
        class="data-tabs__tab"
        [class.data-tabs__tab--active]="activeTab === 'add_info'"
        (click)="activeTab = 'add_info'">
        Дополнительная информация
    </button>
</div>

<div class="data-tabs__content">
    <ng-container *ngIf="activeTab === 'personal' && layoutName === 'Визитки'">
        <div class="data-tabs__fields">
            <app-placeholder
                label="ФИО"
                placeholder="Иванов Иван Иванович"
                #fullNameInput
                [value]="fullName"
                (valueChange)="setFullName($event)"
            ></app-placeholder>

            <app-placeholder
                label="Должность"
                placeholder="Должность"
                [value]="position"
                (valueChange)="setPosition($event)"
            ></app-placeholder>
        </div>
    </ng-container>
    <ng-container *ngIf="activeTab === 'personal' && layoutName === 'Бейджи'">
        <div class="data-tabs__fields">
            <app-placeholder
                label="ФИО"
                placeholder="Иванов Иван Иванович"
                #fullNameInput
                [value]="fullName"
                (valueChange)="setFullName($event)"
            ></app-placeholder>

            <app-placeholder
                label="Роль"
                placeholder="Роль"
                [value]="position"
                (valueChange)="setPosition($event)"
                [maxlength]="55"
            ></app-placeholder>
        </div>
    </ng-container>

    <ng-container *ngIf="activeTab === 'contacts' && (layoutName === 'Бейджи' || layoutName === 'Сертификаты' || layoutName === 'Дипломы')">
        <div class="data-tabs__fields">
            <app-placeholder
                *ngIf="layoutName !== 'Бейджи'"
                label="Место и дата"
                placeholder="Салехард"
                [value]="city"
                (valueChange)="setCity($event)"
            ></app-placeholder>

            <app-placeholder
                *ngIf="layoutName === 'Бейджи'"
                label="Место"
                placeholder="Салехард"
                [maxlength]="28"
                [value]="city"
                (valueChange)="setCity($event)"
            ></app-placeholder>

            <app-placeholder
                *ngIf="layoutName === 'Бейджи'"
                label="Дата"
                placeholder="24.09"
                [posterDateFormat]="true"
                [maxlength]="11"
                [value]="date"
                (valueChange)="setDate($event)"
            ></app-placeholder>
        </div>
    </ng-container>
    
    <ng-container *ngIf="activeTab === 'contacts' && layoutName !== 'Бейджи' && layoutName !== 'Сертификаты' && layoutName !== 'Дипломы'">
        <div class="data-tabs__container">
            <div>
                <div class="data-tabs__contact-label">
                    <span>Тел:</span>
                    <label *ngIf="layoutName === 'Визитки'" class="data-tabs__switch">
                    <input
                        type="checkbox"
                        [ngModel]="showPhone"
                        (ngModelChange)="showPhoneChange.emit($event)"
                    >
                    <span></span>
                    </label>
                </div>
                <app-placeholder
                    label=""
                    placeholder="+7 (000) 000 00 00"
                    [value]="phone"
                    (valueChange)="setPhone($event)"
                    [maxlength]="19"
                    [phoneFormat]="true"
                ></app-placeholder>

                <app-placeholder
                    label="Моб. тел:"
                    placeholder="+7 (000) 000 00 00"
                    [value]="mobilePhone"
                    (valueChange)="setMobilePhone($event)"
                    [maxlength]="19"
                    [phoneFormat]="true"
                ></app-placeholder>
            </div>

            <div>
            <app-placeholder
                label="E-mail:"
                placeholder="pochta@mail.ru"
                [value]="email"
                (valueChange)="setEmail($event)"
            ></app-placeholder>

            <div class="data-tabs__contact-label">
                <span>Адрес:</span>
                <label *ngIf="layoutName === 'Визитки'" class="data-tabs__switch">
                <input
                    type="checkbox"
                    [ngModel]="showAddress"
                    (ngModelChange)="showAddressChange.emit($event)"
                >
                <span></span>
                </label>
            </div>
            <app-placeholder
                label=""
                placeholder="УЛ. ЛЕНИНА, ДОМ 1..."
                [value]="address"
                (valueChange)="setAddress($event)"
                [addressFormat]="true"
            ></app-placeholder>
            </div>
        </div>
    </ng-container>

    <div *ngIf="activeTab === 'qr' && layoutName === 'Визитки'" class="data-tabs__qr">
        @if (qrCodeEntries.length) {
            <p class="data-tabs__qr-hint">QR-код появится на визитке после ввода ссылки.</p>
            <div class="data-tabs__qr-container">
                @for (entry of qrCodeEntries; track $index) {
                    <div class="data-tabs__qr-block">
                        <div class="data-tabs__qr-block-header">
                            <h3>QR-код {{ $index + 1 }}</h3>
                            <button
                                type="button"
                                class="data-tabs__qr-remove"
                                [attr.aria-label]="'Удалить QR-код ' + ($index + 1)"
                                (click)="removeQrCode($index)"
                            >Удалить</button>
                        </div>

                        <app-placeholder
                            label="Ссылка"
                            placeholder="https://example.ru"
                            [value]="entry.value"
                            (valueChange)="setQrCodeLink($index, $event)"
                        ></app-placeholder>

                        <label class="data-tabs__qr-caption-label">
                            <span>Подпись (до двух строк)</span>
                            <textarea
                                class="data-tabs__qr-caption"
                                rows="2"
                                [value]="entry.label"
                                (input)="setQrCodeLabel($index, $event)"
                            ></textarea>
                        </label>
                    </div>
                }
            </div>
        }

        @if (qrCodeEntries.length < 2) {
            <button type="button" class="data-tabs__button" (click)="addQrCode()">
                {{ qrCodeEntries.length ? 'Добавить второй QR-код' : 'Добавить QR-код' }}
            </button>
        }
    </div>

    <ng-container *ngIf="activeTab === 'personal' && (layoutName === 'Сертификаты' || layoutName === 'Дипломы')">
        <div class="data-tabs__fields">
            <app-placeholder
                label="ФИО награждаемого"
                placeholder="Иванову Ивану Ивановичу"
                [value]="recipientName"
                (valueChange)="setRecipientName($event)"
            ></app-placeholder>
            
            <app-placeholder
                label="Должность вручающего"
                placeholder="Должность вручающего"
                [maxlength]="layoutName === 'Дипломы' ? 136 : undefined"
                [value]="position"
                (valueChange)="setPosition($event)"
            ></app-placeholder>

            <app-placeholder
                label="ФИО вручающего"
                placeholder="Иванов Иван Иванович"
                #fullNameInput
                [value]="fullName"
                (valueChange)="setFullName($event)"
            ></app-placeholder>
        </div>
    </ng-container>
    <ng-container *ngIf="activeTab === 'text' && (layoutName === 'Сертификаты' || layoutName === 'Дипломы')">
        <div class="data-tabs__fields">
            <app-placeholder
                class="data-tabs__field--full-width"
                label="Текст"
                placeholder="За победу в номинации «Лучший проект года»"
                [value]="certificateText"
                (valueChange)="setCertificateText($event)"
            ></app-placeholder>
        </div>
    </ng-container>
    <ng-container *ngIf="activeTab === 'event' && layoutName === 'Афиши'">
        <div class="data-tabs__fields">
            <app-placeholder
                label="Тип мероприятия"
                placeholder="Концерт"
                [value]="eventType"
                [maxlength]="20"
                (valueChange)="setEventType($event)"
            ></app-placeholder>

            <app-placeholder
                label="Название"
                placeholder="Название"
                [maxlength]="24"
                [value]="eventShortDescription"
                (valueChange)="setEventShortDescription($event)"
            ></app-placeholder>
        </div>
    </ng-container>

    <ng-container *ngIf="activeTab === 'desc' && layoutName === 'Афиши'">
        <div class="data-tabs__fields">
            <app-placeholder
                class="data-tabs__field--full-width"
                label="Описание"
                placeholder="Краткое описание мероприятия"
                [value]="eventDescription"
                [maxlength]="119"
                (valueChange)="setEventDescription($event)"
            ></app-placeholder>
        </div>
    </ng-container>

    <ng-container *ngIf="activeTab === 'place_and_time' && layoutName === 'Афиши'">
        <div class="data-tabs__fields">
            <app-placeholder
                label="Место"
                placeholder="г. Салехард"
                [value]="eventPlace"
                (valueChange)="setEventPlace($event)"
            ></app-placeholder>

            <app-placeholder
                label="Дата начала"
                placeholder="24.09"
                [posterDateFormat]="layoutName === 'Афиши'"
                [value]="eventDate"
                (valueChange)="setEventDate($event)"
                [maxlength]="14"
            ></app-placeholder>

            <app-placeholder
                label="Дата окончания"
                placeholder="27.09"
                [posterDateFormat]="layoutName === 'Афиши'"
                [value]="eventEndDate"
                (valueChange)="setEventEndDate($event)"
                [maxlength]="14"
            ></app-placeholder>

            <app-placeholder
                label="Время"
                placeholder="18:00"
                [value]="eventTime"
                [timeFormat]="layoutName === 'Афиши'"
                (valueChange)="setEventTime($event)"
            ></app-placeholder>
        </div>
    </ng-container>

    <ng-container *ngIf="activeTab === 'add_info' && layoutName === 'Афиши'">
        <div class="data-tabs__fields">
            <app-placeholder
                class="data-tabs__field--full-width"
                *ngIf="[1, 4, 5].includes(templateId)"
                label="Возрастное ограничение"
                placeholder="18+"
                [value]="eventAgeLimit"
                [maxlength]="3"
                (valueChange)="setEventAgeLimit($event)"
            ></app-placeholder>

            <app-placeholder
                class="data-tabs__field--full-width"
                label="Дополнительная информация"
                placeholder="Дополнительная информация при необходимости"
                [value]="eventAdditionalInfo"
                [maxlength]="58"
                (valueChange)="setEventAdditionalInfo($event)"
            ></app-placeholder>
        </div>
    </ng-container>

</div>
