<main class="constructor">
    <header class="constructor__header">
        <div class="constructor__logo">
            <a routerLink="/">
                <img class="logo-img" src="/yamal_logo.svg">
            </a>
            <p class="constructor__logo-text">Конструктор Материалов</p>
        </div>
        <div class="constructor__buttons">
            <div class="constructor__action-buttons">
                <button class="constructor__action-button" type="button" (click)="undo()">
                    <img src="/left_arrow.svg">
                    
                    Отменить действие
                </button>

                <button class="constructor__action-button" type="button" (click)="redo()">
                    Вернуть действие
                    <img src="/right_arrow.svg">
                </button>
            </div>

            <div class="constructor__download-buttons">
                <button
                    class="constructor__download-button"
                    type="button"
                    [disabled]="isDownloading()"
                    (click)="downloadLayout('png')"
                >
                    <img class="constructor__download-icon" src="/white_download_icon.svg" alt="">
                    Скачать PNG
                </button>
                <button
                    class="constructor__download-button"
                    type="button"
                    [disabled]="isDownloading()"
                    (click)="downloadLayout('pdf')"
                >
                    <img class="constructor__download-icon" src="/white_download_icon.svg" alt="">
                    Скачать PDF
                </button>
            </div>
        </div>
    </header>
    @if (downloadError()) {
        <p class="constructor__download-error" role="alert">{{ downloadError() }}</p>
    }
    <div class="constructor__body">
        <div class="constructor__section-header">
            <span class="constructor__section-title">
                <img src="layouts_icon.svg" alt="">
                Макеты
            </span>
        </div>

        <div class="constructor__content">
            
            <nav class="constructor__categories">
                <p class="constructor__categories-title">
                    Категории
                </p>

                <button
                    *ngFor="let layout of layouts"
                    class="constructor__layout"
                    [class.constructor__layout--active]="selectedLayout === layout"
                    (click)="selectLayout(layout)"
                >
                    <img
                        [src]="layout.icon"
                        [alt]="layout.name"
                    >
                    <span>{{ layout.name }}</span>
                </button>
            </nav>

            <section class="constructor__templates">
                <div class="constructor__category">
                    <span class="constructor__category-text">
                        {{ selectedLayout.name }}
                    </span>
                </div>
                <app-template-list
                    [templates]="selectedLayout.templates"
                    [selectedTemplate]="selectedTemplate"
                    [categoryName]="selectedLayout.name"
                    (templateSelected)="selectTemplate($event)"
                ></app-template-list>
            </section>

            <section class="constructor__workspace">
                <app-layout-preview
                    #layoutPreview
                    [template]="selectedTemplate"
                    [previewSource]="previewSource"
                    [layoutName]="selectedLayout.name"
                    [fullName]="fullName"
                    [position]="position"
                    [recipientName]="recipientName"
                    [certificateText]="certificateText"
                    [phone]="phone"
                    [mobilePhone]="mobilePhone"
                    [email]="email"
                    [address]="address"
                    [city]="city"
                    [date]="date"
                    [showPhone]="showPhone"
                    [showAddress]="showAddress"
                    [qrCodeEntries]="qrCodeEntries"
                    [eventType]="eventType"
                    [eventShortDescription]="eventShortDescription"
                    [eventDescription]="eventDescription"
                    [eventPlace]="eventPlace"
                    [eventDate]="eventDate"
                    [eventTime]="eventTime"
                    [eventAgeLimit]="eventAgeLimit"
                    [eventAdditionalInfo]="eventAdditionalInfo"
                    [eventEndDate]="eventEndDate"
                ></app-layout-preview>

                <div class="constructor__form">
                    <app-data-tabs
                        [layoutName]="selectedLayout.name"
                        [templateId]="selectedTemplate.id"
                        (fullNameChange)="saveState(); fullName = $event; updateSelectedTemplateData()"
                        (positionChange)="saveState(); position = $event; updateSelectedTemplateData()"
                        (phoneChange)="saveState(); phone = $event; updateSelectedTemplateData()"
                        (mobilePhoneChange)="saveState(); mobilePhone = $event; updateSelectedTemplateData()"
                        (emailChange)="saveState(); email = $event; updateSelectedTemplateData()"
                        (addressChange)="saveState(); address = $event; updateSelectedTemplateData()"
                        (cityChange)="saveState(); city = $event; updateSelectedTemplateData()"
                        (dateChange)="saveState(); date = $event; updateSelectedTemplateData()"
                        [showPhone]="showPhone"
                        [showAddress]="showAddress"
                        (showPhoneChange)="showPhone = $event; updateSelectedTemplateData()"
                        (showAddressChange)="showAddress = $event; updateSelectedTemplateData()"
                        [qrCodeEntries]="qrCodeEntries"
                        (qrCodeEntriesChange)="saveState(); qrCodeEntries = $event; updateSelectedTemplateData()"
                        (recipientNameChange)="saveState(); recipientName = $event; updateSelectedTemplateData()"
                        [certificateWording]="certificateWording"
                        (certificateWordingChange)="selectCertificateWording($event)"
                        (certificateTextChange)="saveState(); certificateText = $event; updateSelectedTemplateData()"
                        (eventTypeChange)="saveState(); eventType = $event; updateSelectedTemplateData()"
                        (eventShortDescriptionChange)="saveState(); eventShortDescription = $event; updateSelectedTemplateData()"
                        (eventDescriptionChange)="saveState(); eventDescription = $event; updateSelectedTemplateData()"
                        (eventPlaceChange)="saveState(); eventPlace = $event; updateSelectedTemplateData()"
                        (eventEndDateChange)="saveState(); eventEndDate = $event; updateSelectedTemplateData()"
                        (eventDateChange)="saveState(); eventDate = $event; updateSelectedTemplateData()"
                        (eventTimeChange)="saveState(); eventTime = $event; updateSelectedTemplateData()"
                        (eventAgeLimitChange)="saveState(); eventAgeLimit = $event; updateSelectedTemplateData()"
                        (eventAdditionalInfoChange)="saveState(); eventAdditionalInfo = $event; updateSelectedTemplateData()"
                    ></app-data-tabs>
                </div>
            </section>

        </div>
    </div>

</main>
